<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
  </head>

  <body class="bg-canvas text-ink font-sans antialiased">
    <!-- Mobile menu button (visible only on small screens) -->
    <div
      class="lg:hidden fixed top-0 left-0 z-30 w-full bg-canvas border-b border-line px-5 py-4 flex items-center justify-between"
    >
      <div class="flex flex-col leading-tight">
        <span class="font-mono text-[10px] tracking-[0.3em] text-muted"
          >[AR]</span
        >
        <h1 class="text-xl font-medium tracking-tight text-ink">Weather</h1>
        <span class="label-mono mt-0.5">v1.0 · dashboard</span>
      </div>
      <button
        id="mobile-menu-button"
        class="p-2 rounded-md text-muted hover:bg-canvas transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="flex flex-col lg:flex-row h-screen overflow-hidden">
      <!-- Sidebar - hidden on mobile until toggled -->
      <div
        id="sidebar"
        class="hidden lg:flex lg:w-64 bg-white border-r border-gray-200 flex-col h-screen lg:h-auto fixed inset-y-0 left-0 z-30 lg:relative lg:z-0 lg:pt-0"
      >
        <div class="px-5 pt-6 pb-5">
          <span class="font-mono text-[10px] tracking-[0.3em] text-muted"
            >[AR]</span
          >
          <h1 class="text-2xl font-medium tracking-tight text-ink mt-2">
            Weather
          </h1>
          <span class="label-mono mt-1 block">v1.0 · dashboard</span>
        </div>
        <!-- Search -->
        <div class="px-5 py-5 border-b border-line">
          <form id="search-form" class="flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-muted shrink-0"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="search-input"
              type="text"
              placeholder="search for a city…"
              class="bg-transparent border-0 border-b border-line w-full py-2 text-sm text-ink placeholder-muted font-mono tracking-wide focus:outline-none focus:border-ink transition-colors"
            />
          </form>
        </div>

        <!-- Saved Locations with fixed height and scroll -->
        <div class="p-4 border-b border-gray-200 flex flex-col">
          <h3 class="text-sm font-medium text-gray-500 mb-2">
            SAVED LOCATIONS
          </h3>
          <div id="saved-locations" class="space-y-3 overflow-y-auto max-h-82">
            <!-- Saved locations will be inserted here dynamically -->
          </div>
        </div>

        <!-- Navigation -->
        <div class="px-5 py-5 flex-grow">
          <h3 class="label-mono mb-3">MENU</h3>
          <div class="flex flex-col gap-0.5">
            <button
              id="forecast-btn"
              class="w-full flex items-center gap-3 px-2 py-2 rounded-md text-sm text-ink bg-canvas border-l border-ink pl-3 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="text-ink"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
              </svg>
              Forecast
            </button>
            <button
              id="radar-btn"
              disabled
              class="w-full flex items-center gap-3 px-2 py-2 rounded-md text-sm text-muted hover:bg-canvas transition-colors disabled:text-muted disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="text-muted"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9"></circle>
                <polygon
                  points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5 15.5 8.5"
                ></polygon>
              </svg>
              Radar &amp; Maps
            </button>
            <button
              id="settings-btn"
              disabled
              class="w-full flex items-center gap-3 px-2 py-2 rounded-md text-sm text-muted hover:bg-canvas transition-colors disabled:text-muted disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="text-muted"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                ></path>
              </svg>
              Settings
            </button>
          </div>
        </div>

        <!-- App Info Footer -->
        <div class="p-4 border-t border-gray-200 text-xs text-gray-400">
          <p>
            Weather App v1.0 |
            <a href="https://github.com/armando-rios">Armando Rios</a>
          </p>
          <p>Last updated: March 11, 2025</p>
        </div>
      </div>

      <!-- Main Content -->
      <div class="flex-grow flex flex-col overflow-hidden mt-16 lg:mt-0">
        <!-- Header - This will have some dynamic content but the structure is static -->
        <div class="bg-white border-b border-gray-200 p-4">
          <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between"
          >
            <div>
              <h1 id="current-location" class="text-2xl font-semibold">
                Loading...
              </h1>
              <p id="current-date" class="text-gray-500 text-balance">
                Loading date...
              </p>
            </div>
            <div class="flex items-center mt-2 sm:mt-0">
              <div class="ml-2">
                <div id="current-temp" class="text-3xl font-bold"></div>
                <div id="current-condition" class="text-gray-500">--</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Content Area - Container for dynamic content -->
        <div
          id="main-content"
          class="flex flex-col flex-1 overflow-auto p-4 gap-4"
        >
          <!-- This section will be populated dynamically -->
          <div
            id="loading-indicator"
            class="flex items-center justify-center min-h-full"
          >
            <h1 class="text-lg text-wrap text-center">
              No data to display. Please search for a city to get started.
            </h1>
          </div>
        </div>
      </div>
    </div>

    <div
      id="messages"
      class="hidden fixed bottom-4 right-4 text-white px-4 py-2 rounded-md"
    ></div>

    <script>
      // Simple mobile menu toggle
      document.addEventListener('DOMContentLoaded', function (event) {
        event.stopPropagation();
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');

        mobileMenuButton.addEventListener('click', function () {
          sidebar.classList.toggle('hidden');
        });

        // Close sidebar on mobile when clicking outside
        document.addEventListener('click', function (event) {
          const isClickInsideSidebar = sidebar.contains(event.target);
          const isClickOnMenuButton = mobileMenuButton.contains(event.target);

          if (
            !isClickInsideSidebar &&
            !isClickOnMenuButton &&
            !sidebar.classList.contains('hidden')
          ) {
            sidebar.classList.add('hidden');
          }
        });
      });
    </script>
  </body>
</html>
